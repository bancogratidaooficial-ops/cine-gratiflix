<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CINE GRATIFLIX - PASTAS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial}
.top{background:#000;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:20;border-bottom:1px solid #222}
.hero{padding:16px;background:linear-gradient(180deg,#000,#050505)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;flex-wrap:nowrap}
.chip{white-space:nowrap;background:#111;border:1px solid #333;padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer}
.chip.ativo{background:#f00;border-color:#f00;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#111;border-radius:15px;overflow:hidden;border:1px solid #222;cursor:pointer;position:relative}
.card img{width:100%;height:210px;object-fit:cover;background:#222}
.tag{position:absolute;top:0;left:0;margin:8px;background:#ffcc00;color:#000;font-size:9px;padding:4px 7px;border-radius:20px;font-weight:900}
#player{position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column}
#paywall{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:998;display:none;align-items:flex-end}
.paybox{background:#121212;width:100%;border-radius:22px 22px 0 0;padding:20px;max-height:95vh;overflow:auto}
.pastaTitulo{padding:14px 12px 0 12px;font-weight:900;color:#ffcc00;font-size:14px}
</style>
</head>
<body>
<div class="top"><div style="font-weight:900">🎬 CINE <b style="color:#f00">GRATIFLIX</b></div><div onclick="location.href='codificador.html'" style="color:#ffcc00;font-weight:900">⚙️ Codificar</div></div>
<div class="hero"><div id="chips" class="chips"></div><div id="conteudo"></div></div>
<div id="player"><div style="padding:12px;background:#000;display:flex;justify-content:space-between"><b id="playerTitulo"></b><span onclick="fecharPlayer()" style="background:#222;padding:6px 12px;border-radius:20px">✕ Fechar</span></div><div id="playerVideo" style="flex:1"></div></div>
<div id="paywall"><div class="paybox"><div style="display:flex;justify-content:space-between"><b>🔒 BLOQUEADO</b><span onclick="fecharPaywall()">✕</span></div><p>Entre no grupo VIP para liberar todos os filmes</p><button onclick="window.open(LINK_GRUPO,'_blank')" style="width:100%;padding:14px;background:#00ff88;border:0;border-radius:12px;font-weight:900">ENTRAR NO GRUPO</button></div></div>
<script>
const LINK_GRUPO="https://chat.whatsapp.com/BtNurXoNfSg2V2QbXTasC7s?mode=ac_t";
let filmesPadrao=JSON.parse(localStorage.getItem('cine_filmes_pastas')||'null')||[
{t:"Tempos Modernos",ano:"1936",tag:"COMEDIA",img:"https://img.youtube.com/vi/HAaZ1q1v2Is/hqdefault.jpg",vid:"HAaZ1q1v2Is"},
{t:"A Noite dos Mortos Vivos",ano:"1968",tag:"TERROR",img:"https://img.youtube.com/vi/H91BxkQy6sE/hqdefault.jpg",vid:"H91BxkQy6sE"}
];
let generos=JSON.parse(localStorage.getItem('cine_generos')||'null')||["AÇÃO","FICÇÃO","TERROR","COMÉDIA","ROMANCE","LANÇAMENTO"];
let filtroAtivo="TODOS";
function renderChips(){
let counts={};filmesPadrao.forEach(f=>counts[f.tag]=(counts[f.tag]||0)+1);
let html=`<div class="chip ${filtroAtivo==="TODOS"?"ativo":""}" onclick="setFiltro('TODOS')">TODOS (${filmesPadrao.length})</div>`;
generos.forEach(g=>{let c=counts[g]||0;html+=`<div class="chip ${filtroAtivo===g?"ativo":""}" onclick="setFiltro('${g}')">${g} (${c})</div>`});
document.getElementById('chips').innerHTML=html;
}
function setFiltro(g){filtroAtivo=g;renderChips();renderGrid();}
function renderGrid(){
let lista=filtroAtivo==="TODOS"?filmesPadrao:filmesPadrao.filter(f=>f.tag===filtroAtivo);
window.todosFilmes=lista;
let html="";
if(filtroAtivo==="TODOS"){
generos.forEach(gen=>{let doGen=filmesPadrao.filter(f=>f.tag===gen);if(!doGen.length)return;html+=`<div class="pastaTitulo">📁 ${gen} - ${doGen.length} filmes</div><div class="grid">`+doGen.map(f=>{let gi=filmesPadrao.indexOf(f);return `<div class="card" onclick="abrirPlayerPorGlobal(${gi})"><span class="tag">${f.tag}</span><img src="${f.img}" onerror="this.src='https://via.placeholder.com/300x210?text=SEM+CAPA'"><div style="padding:8px;font-size:12px">${f.t}</div></div>`}).join('')+'</div>'});
}else{html=`<div class="grid">`+lista.map((f,i)=>`<div class="card" data-i="${i}"><span class="tag">${f.tag}</span><img src="${f.img}" onerror="this.src='https://via.placeholder.com/300x210?text=SEM+CAPA'"><div style="padding:8px;font-size:12px">${f.t}</div></div>`).join('')+'</div>'}
document.getElementById('conteudo').innerHTML=html;
if(filtroAtivo!=="TODOS")document.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>abrirPlayer(parseInt(el.dataset.i))));
}
function abrirPlayerPorGlobal(i){abrirPlayerPorFilme(filmesPadrao[i])}
function abrirPlayer(i){abrirPlayerPorFilme(window.todosFilmes[i])}
function abrirPlayerPorFilme(f){document.getElementById('playerTitulo').innerText=f.t;document.getElementById('playerVideo').innerHTML=`<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${f.vid}?autoplay=1" frameborder="0" allowfullscreen></iframe>`;document.getElementById('player').style.display='flex';setTimeout(()=>{document.getElementById('paywall').style.display='flex'}, 120000);}
function fecharPlayer(){document.getElementById('player').style.display='none';document.getElementById('playerVideo').innerHTML='';fecharPaywall();}
function fecharPaywall(){document.getElementById('paywall').style.display='none';}
renderChips();renderGrid();
</script>
</body>
</html>
